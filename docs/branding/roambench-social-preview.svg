      <text x="24" y="32" fill="#d8fdf1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Codex</text>
      <text x="24" y="66" fill="#8ee4c9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">user@roambench:~/project$ codex run review</text>
