# RoamBench Configuration
# Copy to roambench.toml and customize
# Docs: README.md and docs/configuration.md

[server]
host = "0.0.0.0"
port = 3000
# tls_cert = "/etc/roambench/cert.pem"
# tls_key = "/etc/roambench/key.pem"
# allow_insecure_http = true   # only for trusted local/LAN testing

# IP allowlist: only these IPs can access the web UI.
# Replace this with the IPs that should be allowed to reach the web UI.
# Example documentation-only address:
allowed_ips = ["203.0.113.10"]
# Set to true to disable IP filtering (allow all addresses)
# allow_all_ips = false
# Trust X-Forwarded-Proto from reverse proxy (for HSTS, secure cookies)
# trust_proxy = false

[auth]
# "password" (default) or "pam" (requires -tags pam build)
method = "password"
session_timeout = "24h"
max_login_attempts = 5
lockout_duration = "15m"

# For password mode: set the bcrypt hash of your password
# Generate with: ./roambench --password-hash
# Full guide: docs/authentication.md
# Or set env var: ROAMBENCH_PASSWORD_HASH
password_hash = ""

# RoamBench is single-user only.
# This must match the Unix account running the roambench process.
single_user = "your-unix-user"

[terminal]
shell = "/bin/bash"
max_sessions = 0          # 0 = no fixed session count cap
scrollback = 10000       # tmux scrollback lines
idle_timeout = "72h"     # kill idle sessions after this
client_idle_detach = "0" # optional: detach browser bridges after client idle; 0 disables
persist_max_bytes = 67108864  # total disk budget for remembered terminal metadata
# persist_dir = "/home/your-user/.local/state/roambench/terminals"

[ui]
title = "RoamBench"
# motd = "Welcome to my server"
