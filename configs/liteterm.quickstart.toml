# RoamBench Quickstart Configuration
# Fastest path for trusted local/LAN testing.
# This trades security for setup speed:
# - allow_all_ips = true
# - allow_insecure_http = true
#
# Do not expose this configuration directly to the public Internet.
# For a safer setup, start from configs/liteterm.example.toml instead.

[server]
host = "0.0.0.0"
port = 3000
allow_insecure_http = true
allow_all_ips = true

[auth]
method = "password"
session_timeout = "24h"
max_login_attempts = 5
lockout_duration = "15m"

# Generate with: ./liteterm --password-hash
# Leave empty here and provide the hash via LITETERM_PASSWORD_HASH.
password_hash = ""

# Leave empty here and provide the Unix username via LITETERM_USER.
single_user = ""

[terminal]
shell = "/bin/bash"
max_sessions = 0
scrollback = 10000
idle_timeout = "72h"
persist_max_bytes = 67108864

[ui]
title = "RoamBench"
