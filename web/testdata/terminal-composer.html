<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Terminal composer renderer test</title>
<style>
    #output { position: relative; width: 320px; height: 96px; overflow: auto; overflow-anchor: none; }
    #lines { position: absolute; top: 0; left: 0; width: max-content; min-width: 100%; overflow-anchor: none; }
    .terminal-composer-line { white-space: pre; }
</style>
<body data-result="pending">
<div id="output"><div id="top"></div><div id="lines"></div><div id="bottom"></div></div>
<script src="../vendor/xterm/xterm.min.js"></script>
<script src="../js/terminal-composer.js"></script>
<script>
(function() {
    'use strict';

    const settings = {
        foreground: '#dddddd',
        background: '#101010',
        cursor: '#ffffff',
        cursorBlink: false,
        fontFamily: 'monospace',
        fontSize: 14,
        ansi: {
            black: '#000000', red: '#aa0000', green: '#00aa00', yellow: '#aa5500',
            blue: '#0000aa', magenta: '#aa00aa', cyan: '#00aaaa', white: '#aaaaaa',
            brightBlack: '#555555', brightRed: '#ff5555', brightGreen: '#55ff55',
            brightYellow: '#ffff55', brightBlue: '#5555ff', brightMagenta: '#ff55ff',
            brightCyan: '#55ffff', brightWhite: '#ffffff'
        }
    };

    function cell(chars, foreground, bold) {
        return {
            getChars: function() { return chars; },
            getWidth: function() { return 1; },
            getFgColor: function() { return foreground == null ? 0 : foreground; },
            getBgColor: function() { return 0; },
            isFgDefault: function() { return foreground == null; },
            isFgRGB: function() { return false; },
            isFgPalette: function() { return foreground != null; },
            isBgDefault: function() { return true; },
            isBgRGB: function() { return false; },
            isBgPalette: function() { return false; },
            isBold: function() { return Boolean(bold); },
            isDim: function() { return false; },
            isItalic: function() { return false; },
            isUnderline: function() { return false; },
            isBlink: function() { return false; },
            isInverse: function() { return false; },
            isInvisible: function() { return false; },
            isStrikethrough: function() { return false; },
            isOverline: function() { return false; }
        };
    }

    function line(cells) {
        return {
            length: cells.length,
            getCell: function(index) { return cells[index]; }
        };
    }

    const bufferLines = [
        line([cell('R', 1, true), cell('e', 1, true), cell('d', 1, true)]),
        line([cell('$'), cell(' ')])
    ];
    const terminal = {
        buffer: {
            active: {
                length: bufferLines.length,
                baseY: 0,
                cursorY: 1,
                cursorX: 1,
                getLine: function(index) { return bufferLines[index]; }
            },
            onBufferChange: function() { return { dispose: function() {} }; }
        },
        onWriteParsed: function() { return { dispose: function() {} }; },
        onResize: function() { return { dispose: function() {} }; }
    };
    const output = document.getElementById('output');
    const lines = document.getElementById('lines');
    const renderer = window.RoamBenchTerminalComposer.createRenderer({
        term: terminal,
        output: output,
        linesHost: lines,
        topSpacer: document.getElementById('top'),
        bottomSpacer: document.getElementById('bottom'),
        getSettings: function() { return settings; },
        isActive: function() { return true; },
        window: window
    });

    renderer.setActive(true);
    renderer.render(true);

    const firstRun = lines.querySelector('.terminal-composer-run');
    const initialPassed = lines.children.length === 2 &&
        lines.textContent.indexOf('Red') !== -1 &&
        firstRun && firstRun.style.color === 'rgb(255, 85, 85)' &&
        Boolean(lines.querySelector('.terminal-composer-run-cursor'));
    const historyTerminal = new Terminal({
        cols: 40,
        rows: 2,
        scrollback: 600,
        convertEol: true,
        cursorBlink: false,
        disableStdin: true
    });

    const capturedRows = Array.from({ length: 500 }, function(_, index) {
        const label = index === 0 ? 'oldest' : 'history-' + String(index).padStart(3, '0');
        const content = index === 0 ? '\x1b[31m' + label + '\x1b[0m' : label;
        return content + ' '.repeat(40 - label.length);
    }).join('\n');

    historyTerminal.write(capturedRows, function() {
        renderer.setTerminal(historyTerminal, { showCursor: false });
        renderer.followOutput = false;
        output.scrollTop = 0;
        renderer.render(true);

        const historyPassed = historyTerminal.buffer.active.length === 500 &&
            lines.textContent.indexOf('oldest') !== -1 &&
            !lines.querySelector('.terminal-composer-run-cursor');
        const stableSurfaceHeight = document.getElementById('top').style.height;
        const middleScrollTop = Math.floor((output.scrollHeight - output.clientHeight) / 2);
        const scrollTargets = [middleScrollTop, middleScrollTop - 700, middleScrollTop + 350, middleScrollTop - 120];
        const positionsPassed = scrollTargets.every(function(targetScrollTop) {
            output.scrollTop = targetScrollTop;
            renderer.handleScroll();
            renderer.render(true);
            return Math.abs(output.scrollTop - targetScrollTop) <= 1;
        });

        const stableScrollPassed = positionsPassed &&
            document.getElementById('top').style.height === stableSurfaceHeight &&
            document.getElementById('bottom').style.height === '0px' &&
            parseFloat(lines.style.top) > 0;

        document.body.dataset.result = initialPassed && historyPassed && stableScrollPassed ? 'pass' : 'fail';
        renderer.dispose();
        historyTerminal.dispose();
    });
}());
</script>
</body>
</html>
